<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Entrar | N1 Protect</title>
    
    <link rel="stylesheet" href="/login/styles.css">
    <link rel="icon" href="https://n1protect.com.br/n1protectlogo.png">
</head>
<body>
    <main class="login-caixa">
        <div class="login-marca">
            <img src="/images/n1protectlogo.png" alt="N1 PROTECT">
        </div>

        <!-- Exibido enquanto a sessão existente é verificada / o retorno do Google é concluído -->
        <div id="verificando" class="login-sub" role="status" style="margin: 30px 0;">
            Verificando sua sessão…
        </div>

        <div id="conteudo" class="oculto">
            <h1>Entrar no sistema</h1>
            <p class="login-sub">Use sua conta para acessar clientes, orçamentos e agenda.</p>

            <div id="aviso" class="aviso" role="alert" aria-live="polite"></div>

            <form id="form-login" novalidate>
                <div class="campo">
                    <label for="login-email">E-mail</label>
                    <input type="email" id="login-email" name="email" autocomplete="username" inputmode="email"
                           placeholder="voce@empresa.com" required autofocus>
                </div>

                <div class="campo">
                    <label for="login-senha">Senha</label>
                    <div class="campo-senha">
                        <input type="password" id="login-senha" name="senha" autocomplete="current-password"
                               placeholder="Sua senha" required>
                        <button type="button" class="ver-senha" id="btn-ver-senha" aria-label="Mostrar senha" aria-pressed="false">
                            <svg id="icone-olho" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="botao botao-primario" id="btn-entrar">Entrar</button>
            </form>

            <div class="separador">ou</div>

            <button type="button" class="botao botao-google" id="btn-google">
                <svg viewBox="0 0 48 48" aria-hidden="true">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                </svg>
                <span>Entrar com Google</span>
            </button>

            <p class="rodape-nota">Acesso restrito. Se ainda não tem conta, peça ao administrador.</p>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/config.js"></script>
    <script src="/login/script.js"></script>
</body>
</html>
